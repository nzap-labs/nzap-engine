name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # `tauri::generate_context!` embeds the built frontend, so it must exist
      # before the app crate compiles.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      # Last, so one run reports compile, lint and test results before style.
      - name: rustfmt
        if: always()
        run: cargo fmt --all --check

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (everything the app ships)
        run: npm audit --omit=dev --audit-level=moderate
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (RustSec advisories)
        run: cargo audit

  web-e2e:
    name: web e2e (chromium + webkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  desktop-e2e:
    name: desktop e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libdbus-1-dev pkg-config webkit2gtk-driver xvfb

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build the app (debug, dev overrides on) and the mock
        run: |
          npx tauri build --debug --no-bundle
          cargo build --locked -p nzap-mock-colab --bin mock-colab

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install msedgedriver matching WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$env:USERPROFILE/.cargo/bin/msedgedriver-tool.exe"
          "NATIVE_DRIVER=$PWD\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install the E2E runner
        working-directory: e2e/desktop
        run: npm ci

      - name: Smoke-launch the app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node e2e/desktop/smoke.mjs

      - name: Smoke-launch the app (Windows)
        if: runner.os == 'Windows'
        run: node e2e/desktop/smoke.mjs

      - name: Run (Linux)
        if: runner.os == 'Linux'
        working-directory: e2e/desktop
        run: xvfb-run --auto-servernum npm test

      - name: Run (Windows)
        if: runner.os == 'Windows'
        working-directory: e2e/desktop
        run: npm test

      - name: Collect the app logs
        if: failure()
        shell: bash
        run: |
          mkdir -p e2e/desktop/artifacts/logs
          for dir in "$HOME/.local/share/com.nzaplabs.engine/logs" "$LOCALAPPDATA/com.nzaplabs.engine/logs"; do
            [ -d "$dir" ] && cp -r "$dir"/. e2e/desktop/artifacts/logs/ || true
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-e2e-${{ matrix.os }}
          path: e2e/desktop/artifacts
          retention-days: 7
