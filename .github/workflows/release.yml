name: Release

# Push a tag like v0.1.0 to build installers for every platform and attach
# them to a draft GitHub Release. Publish the draft once it looks right.
# Changes to the packaging on a working branch get a Linux-only build-only run
# (no release), which keeps macOS minutes for real releases.
#
# Optional configuration (docs/RELEASING.md):
# - secrets TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD): sign updater bundles and
#   publish latest.json, so installed apps can update themselves;
# - variable RELEASES_REPO (owner/name) + secret RELEASES_TOKEN: publish the
#   release to that public repository instead (the app's first update feed
#   while this repository is private).
on:
  push:
    tags: ['v*']
    branches: ['phase-*']
    paths:
      - src-tauri/tauri.conf.json
      - src-tauri/icons/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && '[{"name":"macOS (universal)","os":"macos-latest","args":"--target universal-apple-darwin"},{"name":"Linux","os":"ubuntu-22.04","args":""},{"name":"Windows","os":"windows-latest","args":""}]' || '[{"name":"Linux","os":"ubuntu-22.04","args":""}]') }}
    runs-on: ${{ matrix.os }}
    env:
      # Signing is optional: each step below runs only when its secrets exist.
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_APPLE_NOTARY: ${{ secrets.APPLE_ID != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      RELEASES_REPO: ${{ vars.RELEASES_REPO }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libdbus-1-dev pkg-config rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Release repository name
        if: env.RELEASES_REPO != ''
        shell: bash
        run: |
          echo "RELEASES_REPO_OWNER=${RELEASES_REPO%%/*}" >> "$GITHUB_ENV"
          echo "RELEASES_REPO_NAME=${RELEASES_REPO#*/}" >> "$GITHUB_ENV"

      - name: Configure macOS code signing
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Configure macOS notarisation
        if: runner.os == 'macOS' && env.HAS_APPLE_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          # A token for the public releases repository when one is configured.
          GITHUB_TOKEN: ${{ (vars.RELEASES_REPO != '' && github.ref_type == 'tag') && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'NZAP Engine ${{ github.ref_name }}'
          releaseBody: |
            Installers for Windows (setup .exe / .msi), macOS (.dmg, universal) and Linux (.AppImage / .deb / .rpm).
            Already installed? NZAP Engine updates itself: Settings → Updates.
            See docs/INSTALL.md for first-launch notes on unsigned builds.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          owner: ${{ (env.RELEASES_REPO != '' && github.ref_type == 'tag') && env.RELEASES_REPO_OWNER || '' }}
          repo: ${{ (env.RELEASES_REPO != '' && github.ref_type == 'tag') && env.RELEASES_REPO_NAME || '' }}
          includeUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
          updaterJsonPreferNsis: true
          # Updater bundles (.sig + latest.json) need the signing key.
          args: ${{ matrix.args }} ${{ env.HAS_UPDATER_KEY == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }}

      # Build-only runs keep the installers as workflow artifacts for testing.
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: installers-${{ runner.os }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7
