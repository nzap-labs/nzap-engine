name: Feature request
description: Suggest an improvement to NZAP Engine.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: parity
    attributes:
      label: Upstream reference
      description: If Colab, google-colab-cli or colab-vscode already does this, link it.
