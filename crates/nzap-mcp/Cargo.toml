[package]
name = "nzap-mcp"
description = "NZAP Engine as an MCP server: AI agents start Colab runtimes, run code and process files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Canonical paths without `\\?\` on Windows, as the agent reads them.
dunce = "1"
log = "0.4"
nzap-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "signal"] }
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
nzap-mock-colab.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
