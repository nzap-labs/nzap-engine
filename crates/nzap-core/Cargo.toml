[package]
name = "nzap-core"
description = "The NZAP Engine: a Rust client for Google Colab runtimes (a port of colab-studio)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["keychain"]
# Store the Google refresh token in the OS keychain (falls back to a 0600
# file at runtime when no keychain is reachable).
keychain = ["dep:keyring"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
percent-encoding = "2"
rand = "0.8"
# TLS for the runtime WebSockets: rustls with an explicit ring provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset", "stream", "multipart"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tracing.workspace = true
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webpki-roots = "0.26"

[dev-dependencies]
nzap-mock-colab.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
